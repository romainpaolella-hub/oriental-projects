# === Koh Samui Estate — configuration Netlify (déploiement depuis Git) ===

[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"

# Le formulaire poste vers /api/brochure -> fonction serverless
[[redirects]]
  from = "/api/brochure"
  to = "/.netlify/functions/brochure"
  status = 200
  force = true

# Le "Mode gestion" des plans interactifs poste vers /api/lots -> fonction serverless
[[redirects]]
  from = "/api/lots"
  to = "/.netlify/functions/lots"
  status = 200
  force = true

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301
