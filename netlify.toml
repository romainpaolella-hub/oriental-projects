# === Koh Samui Estate — configuration Netlify (déploiement depuis Git) ===

[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"

# Le formulaire poste vers /api/brochure -> fonction serverless
[[redirects]]
  from = "/api/brochure"
  to = "/.netlify/functions/brochure"
  status = 200
  force = true

# Le "Mode gestion" des plans interactifs poste vers /api/lots -> fonction serverless
[[redirects]]
  from = "/api/lots"
  to = "/.netlify/functions/lots"
  status = 200
  force = true

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

# Fiches "villa à vendre" créées depuis Studio sans page dédiée : modèle générique
# piloté entièrement par Sanity (data-cms="page.…"). Un fichier réel existant à ce
# chemin est toujours servi en priorité — cette règle ne s'applique qu'en repli.
[[redirects]]
  from = "/villas-a-vendre/*"
  to = "/villas-a-vendre/_template.html"
  status = 200

[[redirects]]
  from = "/en/villas-a-vendre/*"
  to = "/en/villas-a-vendre/_template.html"
  status = 200

# Typologies / parcelles ajoutées depuis Studio (type villaType) sans page dédiée :
# même principe, modèle générique par programme. Un fichier réel existant (résidence,
# villas, investissement, localisation, plan des lots, pages déjà en place) est
# toujours servi en priorité — ne concerne que les 3 programmes existants.
[[redirects]]
  from = "/sea-view/*"
  to = "/sea-view/_template.html"
  status = 200

[[redirects]]
  from = "/en/sea-view/*"
  to = "/en/sea-view/_template.html"
  status = 200

[[redirects]]
  from = "/eden-tropical/*"
  to = "/eden-tropical/_template.html"
  status = 200

[[redirects]]
  from = "/en/eden-tropical/*"
  to = "/en/eden-tropical/_template.html"
  status = 200

[[redirects]]
  from = "/terra-mare/*"
  to = "/terra-mare/_template.html"
  status = 200

[[redirects]]
  from = "/en/terra-mare/*"
  to = "/en/terra-mare/_template.html"
  status = 200
